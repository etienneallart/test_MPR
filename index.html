<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sémiologie MPR en vidéos</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--text:#14212b;--muted:#5b6b78;--accent:#0b7a75;--accent2:#e8f4f3;--border:#dde4ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171c;--card:#18222a;--text:#e8eef2;--muted:#9fb0bc;--accent:#4fd1c5;--accent2:#14302f;--border:#2a3844}}
:root[data-theme="dark"]{--bg:#10171c;--card:#18222a;--text:#e8eef2;--muted:#9fb0bc;--accent:#4fd1c5;--accent2:#14302f;--border:#2a3844}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:12px 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.cat{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;transition:transform .15s,border-color .15s}
.cat:hover{transform:translateY(-2px);border-color:var(--accent)}
.cat .ic{font-size:1.8rem}
.cat h2{font-size:1.1rem;margin:8px 0 4px}
.cat p{margin:0;color:var(--muted);font-size:.9rem}
.cat .n{display:inline-block;margin-top:10px;font-size:.8rem;color:var(--accent);background:var(--accent2);padding:2px 10px;border-radius:99px}
.back{display:inline-block;margin:8px 0 12px;color:var(--accent);text-decoration:none;font-weight:600}
.list{display:flex;flex-direction:column;gap:14px}
.vid{display:flex;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.thumb{flex:0 0 140px;height:90px;border-radius:10px;background:var(--accent2);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:2rem}
.vid h3{font-size:1rem;margin:0 0 4px}
.vid p{margin:0;color:var(--muted);font-size:.88rem}
.soon{opacity:.6;cursor:default}
.note{margin-top:32px;padding:12px 14px;border-radius:10px;background:var(--accent2);color:var(--muted);font-size:.82rem}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal.on{display:flex}
.box{width:100%;max-width:800px}
.box iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}
.box a,.box button{color:#fff;font:inherit;background:none;border:0;cursor:pointer;margin-top:10px;margin-right:16px;padding:0;text-decoration:underline}
@media(max-width:520px){.thumb{flex-basis:96px;height:72px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"><div class="box" id="box"></div></div>
<script>
// === À MODIFIER : ajoutez vos vidéos ici (yt = identifiant YouTube, ex. "dQw4w9WgXcQ") ===
var CATS=[
{id:"marche",ic:"🚶",t:"Marche",d:"Analyse de la marche normale et pathologique",v:[
 {t:"Marche hémiparétique (fauchage)",d:"Description et mécanismes",yt:""},
 {t:"Steppage",d:"Déficit des releveurs du pied",yt:""},
 {t:"Marche parkinsonienne",d:"Festination, démarrage hésitant",yt:""}]},
{id:"spasticite",ic:"💪",t:"Spasticité",d:"Examen du tonus et des réflexes",v:[
 {t:"Échelle d’Ashworth modifiée",d:"Technique d’examen",yt:""},
 {t:"Échelle de Tardieu",d:"Angles X, V1 et V3",yt:""}]},
{id:"membre-superieur",ic:"🖐️",t:"Membre supérieur",d:"Épaule, coude, main",v:[
 {t:"Examen de l’épaule douloureuse",d:"Tests de la coiffe",yt:""},
 {t:"Main spastique",d:"Attitudes vicieuses",yt:""}]},
{id:"rachis",ic:"🦴",t:"Rachis",d:"Examen cervical, dorsal et lombaire",v:[
 {t:"Examen du rachis lombaire",d:"Mobilité, Schober, signes radiculaires",yt:""}]},
{id:"neuropathies",ic:"⚡",t:"Neuropathies",d:"Atteintes nerveuses périphériques",v:[
 {t:"Paralysie du nerf radial",d:"Main tombante",yt:""},
 {t:"Paralysie du nerf fibulaire commun",d:"Steppage et sensibilité",yt:""}]},
{id:"deglutition",ic:"🥤",t:"Déglutition",d:"Évaluation clinique des troubles",v:[
 {t:"Test de déglutition à l’eau",d:"Réalisation et interprétation",yt:""}]}
];
var app=document.getElementById("app"),modal=document.getElementById("modal"),box=document.getElementById("box");
var NOTE='<div class="note">Contenu pédagogique destiné aux professionnels de santé et aux étudiants. Il ne remplace pas un avis médical.</div>';
function home(){
 document.title="Sémiologie MPR en vidéos";
 app.innerHTML='<h1>Sémiologie MPR</h1><p class="sub">Vidéos d’examen clinique en médecine physique et de réadaptation</p><div class="grid">'+
 CATS.map(function(c){return '<a class="cat" href="#'+c.id+'"><div class="ic">'+c.ic+'</div><h2>'+c.t+'</h2><p>'+c.d+'</p><span class="n">'+c.v.length+' vidéo'+(c.v.length>1?'s':'')+'</span></a>'}).join('')+'</div>'+NOTE;
 window.scrollTo(0,0);
}
function cat(c){
 document.title=c.t+" – Sémiologie MPR";
 app.innerHTML='<a class="back" href="#">← Accueil</a><h1>'+c.ic+' '+c.t+'</h1><p class="sub">'+c.d+'</p><div class="list">'+
 c.v.map(function(v,i){return '<button class="vid'+(v.yt?'':' soon')+'" data-i="'+i+'"><div class="thumb">'+(v.yt?'▶':'⏳')+'</div><div><h3>'+v.t+'</h3><p>'+v.d+(v.yt?'':' — vidéo à venir')+'</p></div></button>'}).join('')+'</div>'+NOTE;
 app.querySelectorAll(".vid").forEach(function(b){b.onclick=function(){var v=c.v[b.dataset.i];if(v.yt)play(v)}});
 window.scrollTo(0,0);
}
function play(v){
 box.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+v.yt+'?rel=0" allow="fullscreen" allowfullscreen title="'+v.t+'"></iframe><a href="https://www.youtube.com/watch?v='+v.yt+'" target="_blank" rel="noopener">Ouvrir sur YouTube</a><button id="x">Fermer</button>';
 document.getElementById("x").onclick=close_;modal.classList.add("on");
}
function close_(){modal.classList.remove("on");box.innerHTML=""}
modal.onclick=function(e){if(e.target===modal)close_()};
function route(){
 close_();var h=location.hash.replace("#","");
 var c=CATS.filter(function(x){return x.id===h})[0];
 c?cat(c):home();
}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
